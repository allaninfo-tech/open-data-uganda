name: Validate Datasets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Validate JSONL files
      run: |
        echo "Validating all .jsonl files in datasets/"
        # Find all jsonl files and check if they can be parsed as JSON lines
        find datasets/ -name "*.jsonl" | while read -r file; do
          echo "Checking $file"
          python -c "import json, sys; [json.loads(line) for line in open(sys.argv[1])]" "$file"
          if [ $? -ne 0 ]; then
            echo "Validation failed for $file"
            exit 1
          fi
        done
        echo "All JSONL files are valid!"
